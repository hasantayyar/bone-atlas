<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anatomy — Simple Viewer</title>

  <script type="module"
    src="./node_modules/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #17212c;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="./anatomy.glb"
    alt="3D anatomy model"
    camera-controls
    touch-action="pan-y"
    environment-image="legacy"
    tone-mapping="aces"
    exposure="0.85"
    shadow-intensity="0.5"
    shadow-softness="0.8">
  </model-viewer>
</body>
</html>
